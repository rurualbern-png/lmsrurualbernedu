<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuruAlbernEdu LMS Platform</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden">

    <div id="app-root" class="h-full w-full flex flex-col"></div>
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        let supabaseClient = null;
        let supabaseUrl = '';
        let supabaseKey = '';

        // 1. Tabel users
        let usersTable = [];
        // 2. Tabel courses
        let coursesTable = [];
        // 3. Tabel sessions
        let sessionsTable = [];
        // 4. Tabel quizzes
        let quizzesTable = [];
        // 5. Tabel user_progress
        let userProgressTable = []; 
        
        // Auto-increment counters for new inserts
        let nextCourseId = 101;        
        let nextSessionId = 1001;
        let nextQuizId = 5001;
        let nextProgressId = 1;
        let nextUserId = 1;

        // State Aplikasi Global
        const state = {
            user: null, 
            currentView: 'login', // login, dashboard, course_siswa, session_siswa, course_guru, form_sesi, form_topik, admin_users, supabase_setup
            activeCourseId: null,
            activeSessionId: null,
            quizState: { currentIndex: 0, answers: {}, questions: [], showResultScreen: false, lastScore: 0 }
        };

        const appRoot = document.getElementById('app-root');
        const toastContainer = document.getElementById('toast-container');

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const colors = { info: 'bg-blue-600', success: 'bg-green-600', error: 'bg-red-600', warning: 'bg-yellow-500' };
            toast.className = `${colors[type]} text-white px-4 py-3 rounded shadow-lg transform transition-all duration-300 translate-y-10 opacity-0 flex items-center gap-2`;
            toast.innerHTML = `<i class="ph ph-info flex-shrink-0"></i> <span>${message}</span>`;
            toastContainer.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));
            setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        const DB = {
            getCourseSessions: (courseId) => sessionsTable.filter(s => s.course_id == courseId).sort((a, b) => a.urutan_sesi - b.urutan_sesi),
            getSessionQuiz: (sessionId) => quizzesTable.filter(q => q.session_id == sessionId),
            getUserProgressForCourse: (userId, courseId) => {
                const sessionIds = DB.getCourseSessions(courseId).map(s => s.session_id);
                return userProgressTable.filter(p => p.user_id == userId && sessionIds.includes(p.session_id));
            },
            isSessionLocked: (userId, courseId, urutanSesi) => {
                if (urutanSesi === 1) return false;
                const prevSession = DB.getCourseSessions(courseId).find(s => s.urutan_sesi == urutanSesi - 1);
                if (!prevSession) return false;
                const prevProgress = userProgressTable.find(p => p.user_id == userId && p.session_id == prevSession.session_id);
                return !(prevProgress && prevProgress.status_sesi === 'Selesai');
            },
            getCourseProgressPercent: (userId, courseId) => {
                const totalSessions = DB.getCourseSessions(courseId).length;
                if (totalSessions === 0) return 0;
                const completed = DB.getUserProgressForCourse(userId, courseId).filter(p => p.status_sesi === 'Selesai').length;
                return Math.round((completed / totalSessions) * 100);
            }
        };

        function render() {
            appRoot.innerHTML = '';
            const viewContainer = document.createElement('div');
            viewContainer.className = 'w-full h-full fade-in flex flex-col';

            if (state.currentView === 'supabase_setup') viewContainer.innerHTML = getSupabaseSetupHTML();
            else if (state.currentView === 'login') viewContainer.innerHTML = getLoginHTML();
            else {
                viewContainer.innerHTML += getNavbarHTML();
                if (state.user.role === 'Admin') {
                    if (state.currentView === 'dashboard') viewContainer.innerHTML += getAdminDashboardHTML();
                    else if (state.currentView === 'admin_users') viewContainer.innerHTML += getAdminManageUsersHTML();
                    else if (state.currentView === 'course_guru') viewContainer.innerHTML += getTeacherCourseHTML();
                    else if (state.currentView === 'form_sesi') viewContainer.innerHTML += getTeacherFormSessionHTML();
                    else if (state.currentView === 'form_topik') viewContainer.innerHTML += getTeacherFormCourseHTML();
                } else if (state.user.role === 'Guru') {
                    if (state.currentView === 'dashboard') viewContainer.innerHTML += getTeacherDashboardHTML();
                    else if (state.currentView === 'course_guru') viewContainer.innerHTML += getTeacherCourseHTML();
                    else if (state.currentView === 'form_sesi') viewContainer.innerHTML += getTeacherFormSessionHTML();
                    else if (state.currentView === 'form_topik') viewContainer.innerHTML += getTeacherFormCourseHTML();
                    else if (state.currentView === 'kelola_siswa') viewContainer.innerHTML += getTeacherManageStudentsHTML();
                } else {
                    if (state.currentView === 'dashboard') viewContainer.innerHTML += getStudentDashboardHTML();
                    else if (state.currentView === 'course_siswa') viewContainer.innerHTML += getStudentCourseHTML();
                    else if (state.currentView === 'session_siswa') viewContainer.innerHTML += getStudentSessionHTML();
                }
            }

            appRoot.appendChild(viewContainer);
        }

        function getLoginHTML() {
            return `
                <div class="flex-1 flex items-center justify-center bg-gradient-to-br from-slate-100 to-blue-50 p-4">
                    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100 text-center flex flex-col">
                        <div class="w-16 h-16 bg-blue-600 text-white rounded-xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-lg shadow-blue-200 shrink-0">
                            <i class="ph ph-graduation-cap"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-slate-800 mb-2">RuruAlbernEdu LMS</h1>
                        <p class="text-sm text-slate-500 mb-8">Silakan masuk menggunakan akun yang terdaftar.</p>
                        
                        <form onsubmit="handleLogin(event)" class="text-left space-y-5">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Email Pengguna</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i class="ph ph-envelope-simple text-slate-400 text-lg"></i>
                                    </div>
                                    <input id="login-email" type="email" required class="w-full border border-slate-300 rounded-lg pl-10 p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="contoh@email.com">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Kata Sandi</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i class="ph ph-lock-key text-slate-400 text-lg"></i>
                                    </div>
                                    <input id="login-password" type="password" required class="w-full border border-slate-300 rounded-lg pl-10 p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="••••••••">
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition-colors mt-4 flex items-center justify-center gap-2">
                                Masuk <i class="ph-bold ph-sign-in"></i>
                            </button>
                        </form>
                        
                        <div class="mt-6 pt-6 border-t border-slate-100 flex flex-col gap-3">
                            <button type="button" onclick="manualSyncSupabase()" class="w-full bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 font-bold py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2 text-sm shadow-sm">
                                <i class="ph-bold ph-cloud-arrow-down text-lg"></i> Tarik Data dari Cloud (Sync)
                            </button>
                            <button type="button" onclick="navigateTo('supabase_setup')" class="text-sm text-slate-500 hover:text-blue-600 flex items-center justify-center gap-2 transition-colors font-medium py-2">
                                <i class="ph-fill ph-database"></i> Konfigurasi Database Supabase
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.handleLogin = function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            
            const user = usersTable.find(u => u.email === email && u.password === pass);
            
            if (user) {
                state.user = user;
                state.currentView = 'dashboard';
                render();
                showToast(`Berhasil masuk sebagai ${user.role}`, 'success');
            } else {
                showToast('Email atau Kata Sandi salah!', 'error');
            }
        };

        function logout() {
            state.user = null;
            state.currentView = 'login';
            render();
        }

        function getSupabaseSetupHTML() {
            return `
                <div class="flex-1 flex items-center justify-center bg-slate-50 p-4 overflow-y-auto custom-scrollbar">
                    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-2xl border border-slate-200 my-8">
                        <div class="flex items-center gap-3 mb-6">
                            <div class="w-12 h-12 bg-green-600 text-white rounded-xl flex items-center justify-center text-2xl shadow-lg shadow-green-200 shrink-0">
                                <i class="ph ph-database"></i>
                            </div>
                            <div>
                                <h1 class="text-2xl font-bold text-slate-800">Konfigurasi Supabase</h1>
                                <p class="text-sm text-slate-500">Hubungkan LMS ini ke database cloud Anda secara langsung.</p>
                            </div>
                        </div>
                        
                        <form onsubmit="handleSaveSupabase(event)" class="space-y-4">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1">Supabase Project URL</label>
                                <input id="in-sb-url" type="url" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-green-500 outline-none" placeholder="https://xxxxxx.supabase.co" value="${supabaseUrl}">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1">Supabase Anon Key</label>
                                <input id="in-sb-key" type="password" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-green-500 outline-none" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6..." value="${supabaseKey}">
                            </div>
                            
                            <div class="bg-slate-100 p-4 rounded-lg border border-slate-200 mt-4">
                                <h3 class="text-sm font-bold text-slate-700 mb-2 flex items-center gap-2"><i class="ph-fill ph-info text-blue-500"></i> Skema SQL Database (Jalankan di Supabase SQL Editor / Run without RLS)</h3>
                                <textarea readonly class="w-full h-40 text-xs font-mono bg-slate-800 text-green-400 p-3 rounded custom-scrollbar outline-none focus:ring-2 focus:ring-green-500">
CREATE TABLE users (user_id bigint primary key, nama_lengkap text, email text, password text, role text);
CREATE TABLE courses (course_id bigint primary key, guru_id bigint, judul_kursus text, deskripsi_singkat text);
CREATE TABLE sessions (session_id bigint primary key, course_id bigint, urutan_sesi integer, deskripsi_modul text, tujuan_belajar text, link_video text, bahan_diskusi text, kkm_kuis integer);
CREATE TABLE quizzes (quiz_id bigint primary key, session_id bigint, pertanyaan text, pilihan_ganda jsonb, jawaban_benar integer);
CREATE TABLE user_progress (progress_id bigint primary key, user_id bigint, session_id bigint, skor_kuis integer, status_sesi text);

ALTER TABLE users DISABLE ROW LEVEL SECURITY;
ALTER TABLE courses DISABLE ROW LEVEL SECURITY;
ALTER TABLE sessions DISABLE ROW LEVEL SECURITY;
ALTER TABLE quizzes DISABLE ROW LEVEL SECURITY;
ALTER TABLE user_progress DISABLE ROW LEVEL SECURITY;
                                </textarea>
                            </div>

                            <div class="flex gap-3 pt-4">
                                <button type="button" onclick="bootApp(true)" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-lg transition-colors">Batal / Demo Lokal</button>
                                <button type="submit" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow-md transition-colors flex items-center justify-center gap-2">
                                    Simpan & Hubungkan <i class="ph-bold ph-link"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        window.handleSaveSupabase = async function(e) {
            e.preventDefault();
            const url = document.getElementById('in-sb-url').value;
            const key = document.getElementById('in-sb-key').value;
            
            try {
                localStorage.setItem('SUPABASE_URL', url);
                localStorage.setItem('SUPABASE_ANON_KEY', key);
                showToast('Konfigurasi Supabase berhasil disimpan di LocalStorage!', 'success');
                await bootApp();
            } catch (err) {
                showToast('Gagal menyimpan ke LocalStorage.', 'error');
            }
        };

        async function bootApp(forceBypass = false) {
            try {
                supabaseUrl = localStorage.getItem('SUPABASE_URL') || '';
                supabaseKey = localStorage.getItem('SUPABASE_ANON_KEY') || '';
            } catch (e) {
                console.warn('LocalStorage not available');
            }

            if ((supabaseUrl && supabaseKey) && !forceBypass) {
                try {
                    supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
                    await fetchDataFromSupabase();
                    state.currentView = 'login';
                } catch (error) {
                    showToast('Gagal menghubungkan ke Supabase. Periksa URL & Key Anda.', 'error');
                    state.currentView = 'supabase_setup';
                }
            } else if (forceBypass && (!supabaseUrl || !supabaseKey)) {
                if(usersTable.length === 0) usersTable.push({ user_id: 1, nama_lengkap: 'Super Admin (Lokal)', email: 'admin@app.com', password: '123', role: 'Admin' });
                state.currentView = 'login';
            } else if (!supabaseUrl || !supabaseKey) {
                state.currentView = 'supabase_setup';
            } else {
                state.currentView = 'login';
            }
            render();
        }

        async function fetchDataFromSupabase() {
            showToast('Menyinkronkan data dari cloud...', 'info');
            try {
                const [u, c, s, q, p] = await Promise.all([
                    supabaseClient.from('users').select('*'),
                    supabaseClient.from('courses').select('*'),
                    supabaseClient.from('sessions').select('*'),
                    supabaseClient.from('quizzes').select('*'),
                    supabaseClient.from('user_progress').select('*')
                ]);

                if (u.data) usersTable = u.data;
                if (c.data) coursesTable = c.data;
                if (s.data) sessionsTable = s.data;
                if (q.data) quizzesTable = q.data;
                if (p.data) userProgressTable = p.data;

                if (usersTable.length === 0) {
                    const defaultAdmin = { user_id: 1, nama_lengkap: 'Super Admin', email: 'admin@app.com', password: '123', role: 'Admin' };
                    await supabaseClient.from('users').insert([defaultAdmin]);
                    usersTable.push(defaultAdmin);
                }

                nextUserId = Math.max(0, ...usersTable.map(x => x.user_id)) + 1;
                nextCourseId = Math.max(0, ...coursesTable.map(x => x.course_id)) + 1;
                nextSessionId = Math.max(0, ...sessionsTable.map(x => x.session_id)) + 1;
                nextQuizId = Math.max(0, ...quizzesTable.map(x => x.quiz_id)) + 1;
                nextProgressId = Math.max(0, ...userProgressTable.map(x => x.progress_id)) + 1;
                
                showToast('Sinkronisasi Supabase selesai!', 'success');
            } catch (error) {
                console.error("Error fetching data:", error);
                showToast("Gagal memuat data dari Supabase. Cek konfigurasi dan RLS Anda.", "error");
            }
        }

        window.manualSyncSupabase = async function() {
            if (!supabaseClient && supabaseUrl && supabaseKey) {
                try {
                    supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
                } catch(e) {}
            }
            if (!supabaseClient) {
                showToast('Konfigurasi Supabase belum dilakukan.', 'warning');
                navigateTo('supabase_setup');
                return;
            }
            await fetchDataFromSupabase();
            render();
        };

        function getNavbarHTML() {
            let portalColor = 'bg-slate-100 text-slate-600 border-slate-200';
            let iconColor = 'bg-blue-100 border-blue-500 text-blue-700';
            
            if (state.user.role === 'Guru') {
                iconColor = 'bg-indigo-100 border-indigo-500 text-indigo-700';
            } else if (state.user.role === 'Admin') {
                portalColor = 'bg-emerald-100 text-emerald-700 border-emerald-200';
                iconColor = 'bg-emerald-100 border-emerald-500 text-emerald-700';
            }

            return `
                <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 px-6 py-3 flex justify-between items-center shadow-sm">
                    <div class="flex items-center gap-3 cursor-pointer select-none" onclick="navigateTo('dashboard')">
                        <div class="w-8 h-8 bg-blue-600 text-white rounded-md flex items-center justify-center text-lg shadow">
                            <i class="ph ph-graduation-cap"></i>
                        </div>
                        <span class="font-bold text-slate-800 text-xl tracking-tight">RuruAlbernEdu LMS</span>
                        <span class="text-xs ${portalColor} px-2 py-0.5 rounded ml-2 border">Portal ${state.user.role}</span>
                    </div>
                    <div class="flex items-center gap-3 sm:gap-4">
                        <div class="text-right hidden sm:block">
                            <p class="text-sm font-semibold text-slate-800 leading-tight">${state.user.nama_lengkap}</p>
                            <p class="text-xs text-slate-500">${state.user.role}</p>
                        </div>
                        <div class="w-10 h-10 rounded-full ${iconColor} border-2 flex items-center justify-center font-bold shadow-sm flex-shrink-0">
                            ${state.user.nama_lengkap.charAt(0)}
                        </div>
                        <div class="h-6 w-px bg-slate-200"></div>
                        <button onclick="logout()" class="text-red-600 hover:bg-red-50 hover:text-red-700 px-3 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 border border-transparent hover:border-red-100 flex-shrink-0">
                            <i class="ph ph-sign-out text-xl"></i> <span class="hidden sm:inline">Keluar</span>
                        </button>
                    </div>
                </nav>
            `;
        }

        function navigateTo(view, data = {}) {
            if (data.courseId) state.activeCourseId = data.courseId;
            if (data.sessionId) {
                state.activeSessionId = data.sessionId;
                initQuizState(data.sessionId, false);
            }
            state.currentView = view;
            render();
        }

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex > 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuizState(sessionId, shuffle = false) {
            let quizzes = DB.getSessionQuiz(sessionId);
            if (shuffle) {
                quizzes = JSON.parse(JSON.stringify(quizzes)); 
                quizzes = shuffleArray(quizzes);
            }
            state.quizState.questions = quizzes;
            state.quizState.currentIndex = 0;
            state.quizState.answers = {};
            state.quizState.showResultScreen = false;
            state.quizState.lastScore = 0;
        }

        function getTeacherDashboardHTML() {
            const myCourses = coursesTable.filter(c => c.guru_id === state.user.user_id);
            
            let coursesHTML = myCourses.map(c => `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-all">
                    <div class="p-5">
                        <h4 class="font-bold text-lg text-slate-800 mb-2">${c.judul_kursus}</h4>
                        <p class="text-slate-500 text-sm mb-4">${c.deskripsi_singkat}</p>
                        <div class="flex items-center gap-2 text-sm text-slate-600 mb-4">
                            <i class="ph-fill ph-book-open"></i> ${DB.getCourseSessions(c.course_id).length} Sesi Terdaftar
                        </div>
                        <button onclick="navigateTo('course_guru', {courseId: ${c.course_id}})" class="w-full bg-indigo-50 text-indigo-700 hover:bg-indigo-600 hover:text-white border border-indigo-100 font-semibold py-2 rounded-lg transition-colors flex items-center justify-center gap-2">
                            Kelola Topik <i class="ph ph-arrow-right"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            return `
                <div class="flex-1 bg-slate-50 overflow-y-auto custom-scrollbar p-6 md:p-8">
                    <div class="max-w-6xl mx-auto">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                            <div>
                                <h2 class="text-2xl font-bold text-slate-800">Ruang Instruktur</h2>
                                <p class="text-slate-500">Kelola materi dan pantau progres siswa dengan mudah.</p>
                            </div>
                            <div class="flex gap-3 w-full md:w-auto flex-wrap">
                                <button class="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-lg flex items-center justify-center gap-2 shadow-sm transition-colors" onclick="manualSyncSupabase()">
                                    <i class="ph-bold ph-cloud-arrow-down"></i> Tarik Data (Sync)
                                </button>
                                <button class="flex-1 md:flex-none bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium py-2 px-4 rounded-lg flex items-center justify-center gap-2 shadow-sm transition-colors" onclick="navigateTo('kelola_siswa')">
                                    <i class="ph ph-users"></i> Data Siswa
                                </button>
                                <button class="flex-1 md:flex-none bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg flex items-center justify-center gap-2 shadow-sm transition-colors" onclick="navigateTo('form_topik')">
                                    <i class="ph ph-plus-circle"></i> Buat Topik Baru
                                </button>
                            </div>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Topik Pembelajaran Anda</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${coursesHTML}
                        </div>
                    </div>
                </div>
            `;
        }

        function getTeacherFormCourseHTML() {
            return `
                <div class="flex-1 bg-slate-50 overflow-y-auto custom-scrollbar p-6">
                    <div class="max-w-3xl mx-auto">
                        <button onclick="navigateTo('dashboard')" class="text-indigo-600 hover:underline flex items-center gap-1 mb-4 text-sm font-medium">
                            <i class="ph ph-arrow-left"></i> Batal & Kembali
                        </button>

        };

        window.adminDeleteUser = async function(userId) {
            const index = usersTable.findIndex(u => u.user_id === userId);
            if (index !== -1) {
                const userName = usersTable[index].nama_lengkap;
                usersTable.splice(index, 1);
                if (supabaseClient) await supabaseClient.from('users').delete().eq('user_id', userId);
                showToast(`Pengguna ${userName} dihapus.`, 'info');
                render();
            }
        };

        window.handleSaveSession = async function(e, courseId, urutanSesi) {
            e.preventDefault();
            const newSessionId = nextSessionId++;
            const newSession = {
                session_id: newSessionId,
                course_id: courseId,
                urutan_sesi: urutanSesi,
                deskripsi_modul: document.getElementById('in-desc').value,
                tujuan_belajar: document.getElementById('in-obj').value,
                link_video: document.getElementById('in-vid').value,
                bahan_diskusi: document.getElementById('in-disc').value,
                kkm_kuis: parseInt(document.getElementById('in-kkm').value)
            };
            
            sessionsTable.push(newSession);
            if (supabaseClient) await supabaseClient.from('sessions').insert([newSession]);

            const newQuizzes = [];
            for(let i=0; i<10; i++) {
                newQuizzes.push({
                    quiz_id: nextQuizId++,
                    session_id: newSessionId,
                    pertanyaan: document.getElementById(`in-q-${i}`).value,
                    pilihan_ganda: [
                        document.getElementById(`in-opt-${i}-0`).value,
                        document.getElementById(`in-opt-${i}-1`).value,
                        document.getElementById(`in-opt-${i}-2`).value,
                        document.getElementById(`in-opt-${i}-3`).value
                    ],
                    jawaban_benar: parseInt(document.getElementById(`in-ans-${i}`).value)
                });
            }
            
            quizzesTable.push(...newQuizzes);
            if (supabaseClient) await supabaseClient.from('quizzes').insert(newQuizzes);

            showToast('Sesi dan 10 kuis berhasil disimpan!', 'success');
            navigateTo('course_guru');
        };

            state.quizState.currentIndex += direction;

        window.submitPaginatedQuiz = async function(sessionId) {
            const quizzes = state.quizState.questions;
            const session = sessionsTable.find(s => s.session_id == sessionId);
            const courseId = session.course_id;
            
            let correctCount = 0;
            let answeredCount = Object.keys(state.quizState.answers).length;

            if (answeredCount < quizzes.length) {
                showToast(`Anda baru menjawab ${answeredCount} dari ${quizzes.length} soal!`, 'warning');
                return;
            }

            quizzes.forEach(quiz => {
                if (state.quizState.answers[quiz.quiz_id] === quiz.jawaban_benar) correctCount++;
            });

            const score = Math.round((correctCount / quizzes.length) * 100);

            if (score >= session.kkm_kuis) {
                const existingProg = userProgressTable.find(p => p.user_id == state.user.user_id && p.session_id == sessionId);
                if (existingProg) {
                    existingProg.skor_kuis = score;
                    existingProg.status_sesi = 'Selesai';
                    if (supabaseClient) await supabaseClient.from('user_progress').update({ skor_kuis: score, status_sesi: 'Selesai' }).eq('progress_id', existingProg.progress_id);
                } else {
                    const newProg = { progress_id: nextProgressId++, user_id: state.user.user_id, session_id: sessionId, skor_kuis: score, status_sesi: 'Selesai' };
                    userProgressTable.push(newProg);
                    if (supabaseClient) await supabaseClient.from('user_progress').insert([newProg]);
                }
                
                showToast(`Kelulusan sesi terekam (Skor: ${score})`, 'success');
                render(); 
                if (DB.getCourseProgressPercent(state.user.user_id, courseId) === 100) triggerConfetti();
            } else {
                state.quizState.lastScore = score;
                state.quizState.showResultScreen = true;
                render();
            }
        };

        window.retryQuiz = function(sessionId) {
            initQuizState(sessionId, true);
            render();
        };

        function triggerConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };
            function randomInRange(min, max) { return Math.random() * (max - min) + min; }
            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        function generateCertificatePDF(courseId) {
            const course = coursesTable.find(c => c.course_id === courseId);
            const date = new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

            doc.setFillColor(248, 250, 252); doc.rect(0, 0, 297, 210, 'F');
            doc.setDrawColor(37, 99, 235); doc.setLineWidth(5); doc.rect(10, 10, 277, 190);
            doc.setTextColor(30, 41, 59);
            doc.setFontSize(40); doc.setFont("helvetica", "bold"); doc.text("SERTIFIKAT KELULUSAN", 148.5, 50, { align: "center" });
            doc.setFontSize(16); doc.setFont("helvetica", "normal"); doc.text("Diberikan kepada:", 148.5, 75, { align: "center" });
            doc.setFontSize(36); doc.setTextColor(37, 99, 235); doc.setFont("helvetica", "bolditalic"); doc.text(state.user.nama_lengkap, 148.5, 100, { align: "center" });
            doc.setTextColor(30, 41, 59); doc.setFontSize(14); doc.setFont("helvetica", "normal"); doc.text("Atas penyelesaian program:", 148.5, 120, { align: "center" });
            doc.setFontSize(24); doc.setFont("helvetica", "bold"); doc.text(course.judul_kursus, 148.5, 135, { align: "center" });
            doc.setFontSize(12); doc.text(`Tanggal: ${date}`, 40, 170);
            doc.save(`Sertifikat_${course.judul_kursus.replace(/\s+/g, '_')}.pdf`);
            showToast('Sertifikat berhasil diunduh.', 'success');
        }

        // Jalankan inisialisasi aplikasi
        bootApp();
    </script>
</body>

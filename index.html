        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const configs = {
                info: { bg: 'bg-blue-600', icon: 'ph-info' },
                success: { bg: 'bg-emerald-600', icon: 'ph-check-circle' },
                error: { bg: 'bg-rose-600', icon: 'ph-warning-circle' },
                warning: { bg: 'bg-amber-500', icon: 'ph-warning' }
            };
            const cfg = configs[type] || configs.info;
            toast.className = `${cfg.bg} text-white px-4 py-3 rounded-xl shadow-xl transform transition-all duration-300 translate-y-6 opacity-0 flex items-center gap-3 text-sm font-medium border border-white/10 z-50`;
            toast.innerHTML = `<i class="ph-bold ${cfg.icon} text-lg shrink-0"></i> <span>${message}</span>`;
            toastContainer.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-6', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        const DB = {
            getCourseSessions: (courseId) => sessionsTable.filter(s => Number(s.course_id) === Number(courseId)).sort((a, b) => Number(a.urutan_sesi) - Number(b.urutan_sesi)),
            getSessionQuiz: (sessionId) => quizzesTable.filter(q => Number(q.session_id) === Number(sessionId)),
            getUserProgressForCourse: (userId, courseId) => {
                const sessionIds = DB.getCourseSessions(courseId).map(s => Number(s.session_id));
                return userProgressTable.filter(p => Number(p.user_id) === Number(userId) && sessionIds.includes(Number(p.session_id)));
            },
            isSessionLocked: (userId, courseId, urutanSesi) => {
                if (Number(urutanSesi) === 1) return false;
                const prevSession = DB.getCourseSessions(courseId).find(s => Number(s.urutan_sesi) === Number(urutanSesi) - 1);
                if (!prevSession) return false;
                const prevProg = userProgressTable.find(p => Number(p.user_id) === Number(userId) && Number(p.session_id) === Number(prevSession.session_id));
                return !(prevProg && prevProg.status_sesi === 'Selesai');
            },
            getCourseProgressPercent: (userId, courseId) => {
                const allSessions = DB.getCourseSessions(courseId);
                if (allSessions.length === 0) return 0;
                const completedCount = DB.getUserProgressForCourse(userId, courseId).filter(p => p.status_sesi === 'Selesai').length;
                return Math.round((completedCount / allSessions.length) * 100);
            }
        };

        function getLocalStorageData() {

                const u = localStorage.getItem('LMS_USERS');

                if (c) coursesTable = JSON.parse(c); else coursesTable = [...initialCoursesMock];
                if (s) sessionsTable = JSON.parse(s); else sessionsTable = [...initialSessionsMock];

                if (p) userProgressTable = JSON.parse(p); else userProgressTable = [];

                // PENTING: Pulihkan tema persisten dari kunci khusus `lms_theme_[course_id]`
                coursesTable.forEach((crs) => {
                    const savedThemeKey = localStorage.getItem(`lms_theme_${crs.course_id}`);
                    if (savedThemeKey) {
                        crs.theme = savedThemeKey;
                    } else if (!crs.theme) {
                        crs.theme = 'indigo';
                    }
                });
            } catch (err) {
                console.warn('Gagal membaca LocalStorage:', err);
            }
        }

        function saveLocalStorageData() {
            try {
                // Selalu cadangkan tema setiap course ke kunci khusus lms_theme_[course_id]
                coursesTable.forEach(crs => {
                    if (crs.theme) {
                        localStorage.setItem(`lms_theme_${crs.course_id}`, crs.theme);
                    }
                });
                localStorage.setItem('LMS_USERS', JSON.stringify(usersTable));
                localStorage.setItem('LMS_COURSES', JSON.stringify(coursesTable));
                localStorage.setItem('LMS_SESSIONS', JSON.stringify(sessionsTable));
                localStorage.setItem('LMS_QUIZZES', JSON.stringify(quizzesTable));
                localStorage.setItem('LMS_PROGRESS', JSON.stringify(userProgressTable));
            } catch (e) {
                console.warn('Gagal menyimpan cache LocalStorage:', e);
            }
        }

        async function initSupabaseClient() {
            supabaseUrl = (localStorage.getItem('SUPABASE_URL') || '').trim();
            supabaseKey = (localStorage.getItem('SUPABASE_ANON_KEY') || '').trim();
            if (supabaseUrl && supabaseKey) {
                try {
                    supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
                    return true;
                } catch (e) {
                    supabaseClient = null;
                    return false;
                }
            }
            return false;
        }

        async function manualSyncSupabase() {
            showToast('Menyinkronkan data dengan Supabase...', 'info');
            const isReady = await initSupabaseClient();
            if (!isReady || !supabaseClient) {
                showToast('Kunci Supabase belum lengkap. Silakan atur konfigurasi.', 'warning');
                state.currentView = 'supabase_setup';
                render();
                return;
            }

            try {
                const [resUsers, resCourses, resSessions, resQuizzes, resProg] = await Promise.all([
                    supabaseClient.from('users').select('*'),
                    supabaseClient.from('courses').select('*'),
                    supabaseClient.from('sessions').select('*'),
                    supabaseClient.from('quizzes').select('*'),
                    supabaseClient.from('user_progress').select('*')
                ]);

                if (resUsers.error || resCourses.error || resSessions.error || resQuizzes.error || resProg.error) {
                    throw new Error('Supabase mengembalikan error query. Pastikan RLS dinonaktifkan.');
                }

                if (resUsers.data && resUsers.data.length > 0) usersTable = resUsers.data;
                else { await supabaseClient.from('users').insert(initialUsersMock); usersTable = [...initialUsersMock]; }

                // PENTING: Penggabungan data courses tanpa pernah mereset tema manual pengguna
                if (resCourses.data && resCourses.data.length > 0) {
                    coursesTable = resCourses.data.map(c => {
                        const localSavedTheme = localStorage.getItem(`lms_theme_${c.course_id}`);
                        // Prioritaskan c.theme dari DB jika terisi, jika null/kosong gunakan cadangan lokal pengguna
                        const resolvedTheme = (c.theme && c.theme !== '') ? c.theme : (localSavedTheme || 'indigo');
                        
                        // Perbarui cadangan lokal
                        localStorage.setItem(`lms_theme_${c.course_id}`, resolvedTheme);

                        return {
                            ...c,
                            theme: resolvedTheme
                        };
                    });
                } else {
                    await supabaseClient.from('courses').insert(initialCoursesMock); 
                    coursesTable = [...initialCoursesMock];
                }

                if (resSessions.data && resSessions.data.length > 0) sessionsTable = resSessions.data;
                else { await supabaseClient.from('sessions').insert(initialSessionsMock); sessionsTable = [...initialSessionsMock]; }

                if (resQuizzes.data && resQuizzes.data.length > 0) quizzesTable = resQuizzes.data;
                else { await supabaseClient.from('quizzes').insert(initialQuizzesMock); quizzesTable = [...initialQuizzesMock]; }

                if (resProg.data) userProgressTable = resProg.data;

                saveLocalStorageData();
                showToast('Sinkronisasi selesai & tema tersimpan aman!', 'success');
                render();
            } catch (err) {
                console.error('Error Sync Supabase:', err);
                showToast('Gagal tarik data cloud: ' + (err.message || 'Periksa koneksi'), 'error');
            }
        }

        window.handleCreateUser = async function(e) {
            e.preventDefault();
            const role = document.getElementById('new-user-role').value;
            const name = document.getElementById('new-user-name').value.trim();
            const email = document.getElementById('new-user-email').value.trim();
            const password = document.getElementById('new-user-pass').value.trim();

            if (usersTable.some(u => u.email.toLowerCase() === email.toLowerCase())) {
                showToast('Email sudah digunakan akun lain!', 'error');
                return;
            }

            const maxId = usersTable.reduce((max, u) => Math.max(max, Number(u.user_id) || 0), 0);
            const newUser = {
                user_id: maxId + 1,
                nama_lengkap: name,
                email: email,
                password: password,
                role: role,
                instansi: 'RuruAlbernEdu LMS',
                ttd_url: ''
            };

            usersTable.push(newUser);
            saveLocalStorageData();

            if (supabaseClient) {
                try {
                    await supabaseClient.from('users').insert([newUser]);
                } catch (err) {
                    console.warn('Gagal sync user ke Supabase:', err);
                }
            }

            showToast(`Pengguna baru (${role}) berhasil didaftarkan!`, 'success');
            render();
        };

        window.handleDeleteUser = async function(userId) {
            const userIndex = usersTable.findIndex(u => Number(u.user_id) === Number(userId));
            if (userIndex !== -1) {
                const u = usersTable[userIndex];
                usersTable.splice(userIndex, 1);
                saveLocalStorageData();

                if (supabaseClient) {
                    try {
                        await supabaseClient.from('users').delete().eq('user_id', userId);
                    } catch (e) {
                        console.warn('Gagal delete di Supabase:', e);
                    }
                }
                showToast(`Akun ${u.nama_lengkap} berhasil dihapus.`, 'info');
                render();
            }
        };

        window.loadSampleCsvText = function() {
            const sample = `Ahmad Fauzi, ahmad@sekolah.com, 123\nRina Lestari, rina@sekolah.com, 123\nBambang Suryo, bambang@sekolah.com, 123\nSiti Rahayu, siti@sekolah.com, 123\nDewi Sartika, dewi@sekolah.com, 123`;
            document.getElementById('bulk-text-area').value = sample;
            parseBulkTextAndPreview();
        };

        window.handleBulkFileUpload = function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                document.getElementById('bulk-text-area').value = evt.target.result;
                parseBulkTextAndPreview();
            };
            reader.readAsText(file);
        };

        let parsedBulkStudents = [];

        window.parseBulkTextAndPreview = function() {
            const rawText = document.getElementById('bulk-text-area').value;
            const lines = rawText.split('\n');
            parsedBulkStudents = [];

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;
                if (trimmed.toLowerCase().startsWith('nama') && trimmed.toLowerCase().includes('email')) return;

                const parts = trimmed.split(/[,;]/).map(p => p.trim());
                if (parts.length >= 2) {
                    const nama = parts[0];
                    const email = parts[1];
                    const password = parts[2] || '123';

                    if (nama && email && email.includes('@')) {
                        parsedBulkStudents.push({ nama, email, password });
                    }
                }
            });

            const previewContainer = document.getElementById('bulk-preview-container');
            const previewCount = document.getElementById('bulk-preview-count');
            const previewTbody = document.getElementById('bulk-preview-tbody');

            if (parsedBulkStudents.length > 0) {
                previewContainer.classList.remove('hidden');
                previewCount.textContent = `${parsedBulkStudents.length} Siswa Siap Diimport`;
                previewTbody.innerHTML = parsedBulkStudents.map((std, i) => `
                    <tr>
                        <td class="p-2">${i + 1}</td>
                        <td class="p-2 font-bold">${std.nama}</td>
                        <td class="p-2">${std.email}</td>
                        <td class="p-2 font-mono">${std.password}</td>
                    </tr>
                `).join('');
            } else {
                previewContainer.classList.add('hidden');
                showToast('Tidak ada data siswa yang valid dalam format yang dimasukkan.', 'warning');
            }
        };

        window.executeBulkImport = async function() {
            if (parsedBulkStudents.length === 0) {
                parseBulkTextAndPreview();
            }

            if (parsedBulkStudents.length === 0) {
                showToast('Format data kosong atau belum valid. Pastikan format: Nama, Email, Password', 'warning');
                return;
            }

            let maxId = usersTable.reduce((max, u) => Math.max(max, Number(u.user_id) || 0), 0);
            const newAccounts = [];
            let skippedCount = 0;

            parsedBulkStudents.forEach(std => {
                const emailExists = usersTable.some(u => u.email.toLowerCase() === std.email.toLowerCase()) || newAccounts.some(u => u.email.toLowerCase() === std.email.toLowerCase());
                if (emailExists) {
                    skippedCount++;
                    return;
                }

                maxId++;
                newAccounts.push({
                    user_id: maxId,
                    nama_lengkap: std.nama,
                    email: std.email,
                    password: std.password,
                    role: 'Siswa',
                    instansi: state.user.instansi || 'RuruAlbernEdu LMS',
                    ttd_url: ''
                });
            });

            if (newAccounts.length === 0) {
                showToast(`Seluruh ${skippedCount} akun dalam daftar sudah terdaftar sebelumnya (Email duplikat).`, 'warning');
                return;
            }

            usersTable.push(...newAccounts);
            saveLocalStorageData();

            if (supabaseClient) {
                try {
                    await supabaseClient.from('users').insert(newAccounts);
                } catch (e) {
                    console.warn('Gagal insert batch siswa di Supabase:', e);
                }
            }

            closeModal();
            showToast(`Berhasil mendaftarkan ${newAccounts.length} siswa secara massal! ${skippedCount > 0 ? `(${skippedCount} dilewati karena email duplikat)` : ''}`, 'success');
            render();
        };

        window.handleCreateCourse = async function(e) {
            e.preventDefault();
            const guruId = Number(document.getElementById('course-instruktur').value);
            const title = document.getElementById('course-title').value.trim();
            const desc = document.getElementById('course-desc').value.trim();
            const selectedTheme = document.querySelector('input[name="course-theme-radio"]:checked')?.value || 'indigo';

            const maxId = coursesTable.reduce((m, c) => Math.max(m, Number(c.course_id) || 0), 100);
            const newCourseId = maxId + 1;
            const newCourse = {
                course_id: newCourseId,
                guru_id: guruId,
                judul_kursus: title,
                deskripsi_singkat: desc,
                theme: selectedTheme
            };

            coursesTable.push(newCourse);
            
            // Simpan tema ke kunci cadangan lokal
            localStorage.setItem(`lms_theme_${newCourseId}`, selectedTheme);
            saveLocalStorageData();

            if (supabaseClient) {
                try {
                    await supabaseClient.from('courses').insert([newCourse]);
                } catch (err) {
                    console.warn('Gagal insert course di Supabase:', err);
                }
            }

            showToast('Topik pembelajaran baru berhasil disimpan!', 'success');
            navigateTo('dashboard');
        };

            const newTheme = document.querySelector('input[name="edit-theme-radio"]:checked')?.value || 'indigo';

            const idx = coursesTable.findIndex(c => Number(c.course_id) === Number(courseId));
            if (idx !== -1) {
                coursesTable[idx].judul_kursus = newTitle;
                coursesTable[idx].deskripsi_singkat = newDesc;
                coursesTable[idx].theme = newTheme;
                
                // Simpan kunci persistensi tema
                localStorage.setItem(`lms_theme_${courseId}`, newTheme);
                saveLocalStorageData();
            }

            if (supabaseClient) {
                try {
                    await supabaseClient.from('courses').update({
                        judul_kursus: newTitle,
                        deskripsi_singkat: newDesc,
                        theme: newTheme
                    }).eq('course_id', courseId);

        window.executeDeleteSession = async function(sessionId, courseId) {
            sessionsTable = sessionsTable.filter(s => Number(s.session_id) !== Number(sessionId));
            quizzesTable = quizzesTable.filter(q => Number(q.session_id) !== Number(sessionId));
            userProgressTable = userProgressTable.filter(p => Number(p.session_id) !== Number(sessionId));
            
            const remainingSessions = sessionsTable.filter(s => Number(s.course_id) === Number(courseId)).sort((a,b) => a.urutan_sesi - b.urutan_sesi);
            remainingSessions.forEach((s, idx) => { s.urutan_sesi = idx + 1; });

            saveLocalStorageData();

            if (supabaseClient) {
                try {
                    await supabaseClient.from('user_progress').delete().eq('session_id', sessionId);
                    await supabaseClient.from('quizzes').delete().eq('session_id', sessionId);
                    await supabaseClient.from('sessions').delete().eq('session_id', sessionId);
                    for (const s of remainingSessions) {
                        await supabaseClient.from('sessions').update({ urutan_sesi: s.urutan_sesi }).eq('session_id', s.session_id);
                    }
                } catch (err) {
                    console.warn('Gagal delete sesi di Supabase:', err);
                }
            }

            closeModal();
            showToast('Sesi pembelajaran dan kuis terkait berhasil dihapus.', 'info');
            render();
        };

        window.handleSaveEditedSession = async function(e, sessionId) {
            e.preventDefault();
            const desc = document.getElementById('edit-sess-desc').value.trim();
            const tujuan = document.getElementById('edit-sess-tujuan').value.trim();
            const video = document.getElementById('edit-sess-video').value.trim();
            const kkm = Number(document.getElementById('edit-sess-kkm').value);
            const diskusi = document.getElementById('edit-sess-diskusi').value.trim();

            const sessIdx = sessionsTable.findIndex(s => Number(s.session_id) === Number(sessionId));
            if (sessIdx !== -1) {
                sessionsTable[sessIdx].deskripsi_modul = desc;
                sessionsTable[sessIdx].tujuan_belajar = tujuan;
                sessionsTable[sessIdx].link_video = video;
                sessionsTable[sessIdx].kkm_kuis = kkm;
                sessionsTable[sessIdx].bahan_diskusi = diskusi;
            }

            const updatedQuizzes = [];
            for (let i = 0; i < 10; i++) {
                const qId = Number(document.getElementById(`edit-quiz-id-${i}`).value);
                const qText = document.getElementById(`edit-quiz-q-${i}`).value.trim();
                const optA = document.getElementById(`edit-quiz-opt-${i}-0`).value.trim();
                const optB = document.getElementById(`edit-quiz-opt-${i}-1`).value.trim();
                const optC = document.getElementById(`edit-quiz-opt-${i}-2`).value.trim();
                const optD = document.getElementById(`edit-quiz-opt-${i}-3`).value.trim();
                const ans = Number(document.getElementById(`edit-quiz-ans-${i}`).value);

                const quizObj = {
                    quiz_id: qId,
                    session_id: sessionId,
                    pertanyaan: qText,
                    pilihan_ganda: [optA, optB, optC, optD],
                    jawaban_benar: ans
                };

                const qIndex = quizzesTable.findIndex(q => Number(q.quiz_id) === Number(qId));
                if (qIndex !== -1) {
                    quizzesTable[qIndex] = quizObj;
                } else {
                    quizzesTable.push(quizObj);
                }
                updatedQuizzes.push(quizObj);
            }

            saveLocalStorageData();

            if (supabaseClient) {
                try {
                    await supabaseClient.from('sessions').update({
                        deskripsi_modul: desc,
                        tujuan_belajar: tujuan,
                        link_video: video,
                        kkm_kuis: kkm,
                        bahan_diskusi: diskusi
                    }).eq('session_id', sessionId);

                    await supabaseClient.from('quizzes').upsert(updatedQuizzes);
                } catch (err) {
                    console.warn('Gagal sinkron update sesi ke Supabase:', err);
                }
            }

            closeModal();
            showToast('Sesi pembelajaran dan 10 kuis berhasil diperbarui!', 'success');
            render();
        };

        window.handleSaveSessionAndQuizzes = async function(e, courseId, urutanSesi) {
            e.preventDefault();
            const desc = document.getElementById('sess-desc').value.trim();
            const tujuan = document.getElementById('sess-tujuan').value.trim();
            const video = document.getElementById('sess-video').value.trim();
            const kkm = Number(document.getElementById('sess-kkm').value);
            const diskusi = document.getElementById('sess-diskusi').value.trim();

            const maxSessId = sessionsTable.reduce((m, s) => Math.max(m, Number(s.session_id) || 0), 1000);
            const newSessionId = maxSessId + 1;

            const newSession = {
                session_id: newSessionId,
                course_id: courseId,
                urutan_sesi: urutanSesi,
                deskripsi_modul: desc,
                tujuan_belajar: tujuan,
                link_video: video,
                bahan_diskusi: diskusi,
                kkm_kuis: kkm
            };

            let maxQuizId = quizzesTable.reduce((m, q) => Math.max(m, Number(q.quiz_id) || 0), 5000);
            const newQuizzes = [];

            for (let i = 0; i < 10; i++) {
                maxQuizId++;
                const qText = document.getElementById(`quiz-q-${i}`).value.trim();
                const optA = document.getElementById(`quiz-opt-${i}-0`).value.trim();
                const optB = document.getElementById(`quiz-opt-${i}-1`).value.trim();
                const optC = document.getElementById(`quiz-opt-${i}-2`).value.trim();
                const optD = document.getElementById(`quiz-opt-${i}-3`).value.trim();
                const ans = Number(document.getElementById(`quiz-ans-${i}`).value);

                newQuizzes.push({
                    quiz_id: maxQuizId,
                    session_id: newSessionId,
                    pertanyaan: qText,
                    pilihan_ganda: [optA, optB, optC, optD],
                    jawaban_benar: ans
                });
            }

            sessionsTable.push(newSession);
            quizzesTable.push(...newQuizzes);
            saveLocalStorageData();

            if (supabaseClient) {
                try {
                    await supabaseClient.from('sessions').insert([newSession]);
                    await supabaseClient.from('quizzes').insert(newQuizzes);
                } catch (err) {
                    console.warn('Gagal insert sesi/kuis di Supabase:', err);
                }
            }

            showToast('Sesi baru dan 10 kuis berhasil disimpan!', 'success');
            navigateTo('course_guru');
        };

                                                <button onclick="navigateTo('session_siswa', {sessionId: ${s.session_id}})" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-4 py-2 rounded-xl text-xs transition flex items-center gap-1.5 border border-emerald-200">
                                                    <i class="ph-bold ph-eye"></i> Tinjau Ulang (Skor: ${progress.skor_kuis})
                                                </button>
                                            ` : (!isLocked ? `
                                                <button onclick="navigateTo('session_siswa', {sessionId: ${s.session_id}})" class="${themeCfg.btnBg} font-bold px-5 py-2 rounded-xl text-xs transition shadow-xs flex items-center gap-1.5">
                                                    <span>Mulai Belajar</span> <i class="ph-bold ph-arrow-right"></i>
                                                </button>
                                            ` : `
                                                <span class="text-xs text-slate-400 italic">Selesaikan sesi sebelumnya</span>
                                            `)}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function getStudentSessionHTML() {
            const session = sessionsTable.find(s => Number(s.session_id) === Number(state.activeSessionId));
            if (!session) return '<div class="p-8">Sesi tidak ditemukan.</div>';

            const course = coursesTable.find(c => Number(c.course_id) === Number(session.course_id));
            const progress = userProgressTable.find(p => Number(p.user_id) === Number(state.user.user_id) && Number(p.session_id) === Number(session.session_id));
            const isCompleted = progress && progress.status_sesi === 'Selesai';
            const quizzes = state.quizState.questions;

            return `
                <div class="flex-1 bg-slate-50 overflow-y-auto custom-scrollbar p-5 sm:p-8">
                    <div class="max-w-3xl mx-auto space-y-6">
                        <button onclick="navigateTo('course_siswa')" class="text-blue-600 hover:underline flex items-center gap-1.5 font-bold text-sm">
                            <i class="ph-bold ph-arrow-left"></i> Kembali ke Silabus
                        </button>

                        <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-xs space-y-5">
                            <div>
                                <span class="text-xs font-bold text-blue-600 uppercase tracking-wider">Sesi ke-${session.urutan_sesi}</span>
                                <h1 class="text-2xl font-extrabold text-slate-800 mt-1">${course.judul_kursus}</h1>
                                <p class="text-sm text-slate-600 mt-2 leading-relaxed">${session.deskripsi_modul}</p>
                            </div>

                            <div class="bg-blue-50/70 border border-blue-100 rounded-2xl p-4">
                                <h4 class="text-xs font-bold text-blue-900 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                                    <i class="ph-bold ph-target"></i> Tujuan Pembelajaran
                                </h4>
                                <ul class="text-xs text-blue-800 space-y-1">
                                    ${session.tujuan_belajar.split('\n').filter(t => t.trim()).map(t => `<li class="flex items-start gap-1.5"><i class="ph-bold ph-check mt-0.5 text-blue-600"></i> ${t}</li>`).join('')}
                                </ul>
                            </div>

                            <div>
                                <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                                    <i class="ph-bold ph-video"></i> Video Modul Pembelajaran
                                </h4>
                                <div class="rounded-2xl overflow-hidden border border-slate-200 aspect-video relative bg-slate-900 group">
                                    <img src="${session.link_video}" alt="Video" class="w-full h-full object-cover opacity-80 group-hover:scale-105 transition-transform duration-300">
                                    <div class="absolute inset-0 flex items-center justify-center">
                                        <button onclick="showToast('Video materi sedang diputar...', 'info')" class="w-16 h-16 rounded-full bg-white/90 text-blue-600 hover:bg-white shadow-xl flex items-center justify-center text-3xl transition">
                                            <i class="ph-fill ph-play ml-1"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-amber-50/70 border border-amber-200 rounded-2xl p-4">
                                <h4 class="text-xs font-bold text-amber-900 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                                    <i class="ph-bold ph-chats-circle"></i> Pemantik Diskusi
                                </h4>
                                <p class="text-xs text-amber-800">${session.bahan_diskusi}</p>
                            </div>
                        </div>

                        <!-- Evaluasi Kuis 10 Soal -->
                        <div class="bg-white rounded-3xl border border-slate-200 shadow-xs overflow-hidden">
                            <div class="p-5 ${isCompleted ? 'bg-emerald-600' : 'bg-slate-900'} text-white flex justify-between items-center">
                                <div>
                                    <h3 class="font-extrabold text-lg flex items-center gap-2">
                                        <i class="ph-bold ph-exam"></i> Evaluasi Kompetensi (10 Kuis)
                                    </h3>
                                    <span class="text-xs ${isCompleted ? 'text-emerald-100' : 'text-slate-400'}">Syarat Kelulusan KKM: ${session.kkm_kuis}</span>
                                </div>
                                ${isCompleted ? `
                                    <span class="bg-white/20 text-white font-extrabold text-xs px-3.5 py-1.5 rounded-full border border-white/20">
                                        LULUS • Nilai: ${progress.skor_kuis}
                                    </span>
                                ` : ''}
                            </div>

                            <div class="p-6">
                                ${isCompleted ? `
                                    <div class="text-center py-6 space-y-3">
                                        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto">
                                            <i class="ph-bold ph-check"></i>
                                        </div>
                                        <h4 class="text-xl font-bold text-slate-800">Sesi Ini Telah Tuntas!</h4>
                                        <p class="text-xs text-slate-500 max-w-md mx-auto">Anda telah lulus kuis evaluasi dengan skor ${progress.skor_kuis}. Anda dapat melangkah ke sesi selanjutnya.</p>
                                        <button onclick="navigateTo('course_siswa')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded-xl text-xs transition shadow-xs">
                                            Lanjut ke Silabus
                                        </button>
                                    </div>
                                ` : (state.quizState.showResultScreen ? `
                                    <div class="text-center py-6 space-y-4">
                                        <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center text-3xl mx-auto">
                                            <i class="ph-bold ph-x"></i>
                                        </div>
                                        <div>
                                            <h4 class="text-xl font-bold text-slate-800">Belum Mencapai KKM</h4>
                                            <p class="text-xs text-slate-500 mt-1">Skor Anda: <span class="font-extrabold text-rose-600 text-base">${state.quizState.lastScore}</span> (KKM: ${session.kkm_kuis})</p>
                                        </div>
                                        <p class="text-xs text-slate-400 max-w-sm mx-auto">Coba ulangi kembali kuis dengan urutan pertanyaan yang telah diacak.</p>
                                        <button onclick="handleRetryQuiz(${session.session_id})" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl text-xs transition shadow-md flex items-center gap-2 mx-auto">
                                            <i class="ph-bold ph-arrows-clockwise text-base"></i> Ulangi Kuis (Acak Soal)
                                        </button>
                                    </div>
                                ` : `
                                    ${quizzes.length === 0 ? '<p class="text-center text-slate-400 py-6">Kuis belum dikonfigurasi untuk sesi ini.</p>' : `
                                        <div>
                                            ${(() => {
                                                const qIdx = state.quizState.currentIndex;
                                                const q = quizzes[qIdx];
                                                const currentAnswer = state.quizState.answers[q.quiz_id];

                                                return `
                                                    <div class="space-y-4">
                                                        <div class="flex justify-between items-center text-xs font-bold text-slate-500 pb-2 border-b border-slate-100">
                                                            <span>Pertanyaan ${qIdx + 1} dari ${quizzes.length}</span>
                                                            <span class="text-indigo-600">${Math.round(((qIdx + 1) / quizzes.length) * 100)}%</span>
                                                        </div>

                                                        <h4 class="text-base font-bold text-slate-800 leading-snug">${q.pertanyaan}</h4>

                                                        <div class="space-y-2 pt-2">
                                                            ${q.pilihan_ganda.map((opt, oIdx) => {
                                                                const isSelected = currentAnswer === oIdx;
                                                                return `
                                                                    <div onclick="handleChooseAnswer(${q.quiz_id}, ${oIdx})" class="p-3.5 rounded-xl border text-xs font-medium cursor-pointer transition flex items-center justify-between ${
                                                                        isSelected ? 'bg-indigo-50 border-indigo-600 text-indigo-900 font-bold' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
                                                                    }">
                                                                        <span>${['A', 'B', 'C', 'D'][oIdx]}. ${opt}</span>
                                                                        <i class="ph-bold ${isSelected ? 'ph-check-circle text-indigo-600 text-base' : 'ph-circle text-slate-300 text-base'}"></i>
                                                                    </div>
                                                                `;
                                                            }).join('')}
                                                        </div>

                                                        <div class="pt-4 flex justify-between items-center border-t border-slate-100 mt-4">
                                                            <button onclick="handleQuizNav(-1)" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition flex items-center gap-1 ${qIdx === 0 ? 'invisible' : ''}">
                                                                <i class="ph-bold ph-arrow-left"></i> Sebelumnya
                                                            </button>

                                                            ${qIdx === quizzes.length - 1 ? `
                                                                <button onclick="handleSubmitQuiz(${session.session_id})" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-extrabold transition shadow-md flex items-center gap-1.5">
                                                                    <span>Selesaikan & Kumpulkan</span> <i class="ph-bold ph-check"></i>
                                                                </button>
                                                            ` : `
                                                                <button onclick="handleQuizNav(1)" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1">
                                                                    <span>Selanjutnya</span> <i class="ph-bold ph-arrow-right"></i>
                                                                </button>
                                                            `}
                                                        </div>
                                                    </div>
                                                `;
                                            })()}
                                        </div>
                                    `}
                                `)}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.handleChooseAnswer = function(quizId, optIdx) {
            state.quizState.answers[quizId] = optIdx;
            render();
        };

        window.handleQuizNav = function(step) {
            state.quizState.currentIndex += step;
            render();
        };

        window.handleRetryQuiz = function(sessionId) {
            initQuizState(sessionId, true);
            render();
        };

        window.handleSubmitQuiz = async function(sessionId) {
            const session = sessionsTable.find(s => Number(s.session_id) === Number(sessionId));
            const quizzes = state.quizState.questions;

            const answeredCount = Object.keys(state.quizState.answers).length;
            if (answeredCount < quizzes.length) {
                showToast(`Harap selesaikan seluruh ${quizzes.length} soal sebelum mengumpulkan!`, 'warning');
                return;
            }

            let correctCount = 0;
            quizzes.forEach(q => {
                if (state.quizState.answers[q.quiz_id] === q.jawaban_benar) {
                    correctCount++;
                }
            });

            const score = Math.round((correctCount / quizzes.length) * 100);

            if (score >= session.kkm_kuis) {
                let existing = userProgressTable.find(p => Number(p.user_id) === Number(state.user.user_id) && Number(p.session_id) === Number(sessionId));
                if (existing) {
                    existing.skor_kuis = score;
                    existing.status_sesi = 'Selesai';
                } else {
                    const maxProgId = userProgressTable.reduce((m, p) => Math.max(m, Number(p.progress_id) || 0), 0);
                    existing = {
                        progress_id: maxProgId + 1,
                        user_id: state.user.user_id,
                        session_id: sessionId,
                        skor_kuis: score,
                        status_sesi: 'Selesai'
                    };
                    userProgressTable.push(existing);
                }

                saveLocalStorageData();

                if (supabaseClient) {
                    try {
                        await supabaseClient.from('user_progress').upsert([existing]);
                    } catch (e) {
                        console.warn('Gagal simpan progres di Supabase:', e);
                    }
                }

                showToast(`Selamat! Anda LULUS dengan nilai ${score}!`, 'success');
                confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
                render();
            } else {
                state.quizState.lastScore = score;
                state.quizState.showResultScreen = true;
                render();
            }
        };

        window.downloadStudentCertificate = function(courseId) {
            const course = coursesTable.find(c => Number(c.course_id) === Number(courseId));
            const instructor = usersTable.find(u => Number(u.user_id) === Number(course.guru_id)) || state.user;
            const instansiName = instructor.instansi || 'RuruAlbernEdu LMS Platform';
            const signatureImg = instructor.ttd_url || '';
            const studentName = state.user.nama_lengkap;
            const courseTitle = course.judul_kursus;
            const dateStr = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

            doc.setFillColor(255, 255, 255);
            doc.rect(0, 0, 297, 210, 'F');

            doc.setDrawColor(217, 119, 6);
            doc.setLineWidth(3);
            doc.rect(10, 10, 277, 190);

            doc.setDrawColor(245, 158, 11);
            doc.setLineWidth(1);
            doc.rect(14, 14, 269, 182);

            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.setTextColor(180, 83, 9);
            doc.text(instansiName.toUpperCase(), 148.5, 30, { align: 'center' });

            doc.setFont("helvetica", "bold");
            doc.setFontSize(28);
            doc.setTextColor(15, 23, 42);
            doc.text("SERTIFIKAT KELULUSAN", 148.5, 48, { align: 'center' });

            doc.setFont("helvetica", "normal");
            doc.setFontSize(11);
            doc.setTextColor(100, 116, 139);
            doc.text("Nomor Sertifikat: CERT/RAE/" + courseId + "/" + state.user.user_id + "/" + Date.now().toString().slice(-6), 148.5, 56, { align: 'center' });

            doc.setFontSize(12);
            doc.setTextColor(51, 65, 85);
            doc.text("Diberikan dengan penuh kehormatan kepada:", 148.5, 75, { align: 'center' });

            doc.setFont("helvetica", "bold");
            doc.setFontSize(26);
            doc.setTextColor(30, 58, 138);
            doc.text(studentName, 148.5, 92, { align: 'center' });

            doc.setDrawColor(203, 213, 225);
            doc.setLineWidth(0.5);
            doc.line(75, 96, 222, 96);

            doc.setFont("helvetica", "normal");
            doc.setFontSize(12);
            doc.setTextColor(51, 65, 85);
            doc.text("Telah menyelesaikan seluruh rangkaian modul, evaluasi, dan memenuhi syarat KKM pada program:", 148.5, 110, { align: 'center' });

            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.setTextColor(15, 23, 42);
            doc.text(`"${courseTitle}"`, 148.5, 124, { align: 'center' });

            doc.setFont("helvetica", "normal");
            doc.setFontSize(11);
            doc.setTextColor(71, 85, 105);
            doc.text(`Diterbitkan pada tanggal: ${dateStr}`, 148.5, 138, { align: 'center' });

            const signX = 205;
            const signY = 150;

            if (signatureImg && signatureImg.startsWith('data:image')) {
                try {
                    doc.addImage(signatureImg, 'PNG', signX - 25, signY, 50, 20);
                } catch (e) {
                    doc.text("[ Tanda Tangan Terverifikasi ]", signX, signY + 12, { align: 'center' });
                }
            } else {
                doc.setFont("courier", "italic");
                doc.setFontSize(14);
                doc.setTextColor(30, 58, 138);
                doc.text(instructor.nama_lengkap, signX, signY + 12, { align: 'center' });
            }

            doc.setFont("helvetica", "bold");
            doc.setFontSize(11);
            doc.setTextColor(15, 23, 42);
            doc.text(instructor.nama_lengkap, signX, signY + 28, { align: 'center' });

            doc.setFont("helvetica", "normal");
            doc.setFontSize(9);
            doc.setTextColor(100, 116, 139);
            doc.text("Instruktur Pembimbing", signX, signY + 33, { align: 'center' });

            doc.setDrawColor(217, 119, 6);
            doc.setFillColor(254, 243, 199);
            doc.circle(70, 165, 14, 'FD');
            doc.setFontSize(8);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(180, 83, 9);
            doc.text("RESMI", 70, 163, { align: 'center' });
            doc.text("LULUS", 70, 168, { align: 'center' });

            doc.save(`Sertifikat_${studentName.replace(/\s+/g, '_')}_${courseTitle.replace(/\s+/g, '_')}.pdf`);
            showToast('Sertifikat resmi berhasil diunduh dalam format PDF!', 'success');
        };

        function navigateTo(view, data = {}) {
            if (data.courseId) state.activeCourseId = data.courseId;
            if (data.sessionId) {
                state.activeSessionId = data.sessionId;
                initQuizState(data.sessionId, false);
            }
            state.currentView = view;
            render();
        }

        function initQuizState(sessionId, shuffle = false) {
            let questions = DB.getSessionQuiz(sessionId);
            if (shuffle) {
                questions = [...questions].sort(() => Math.random() - 0.5);
            }
            state.quizState.questions = questions;
            state.quizState.currentIndex = 0;
            state.quizState.answers = {};
            state.quizState.showResultScreen = false;
            state.quizState.lastScore = 0;
        }

        window.handleLoginSubmit = function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const pass = document.getElementById('login-password').value.trim();

            const user = usersTable.find(u => u.email.toLowerCase() === email && u.password === pass);

            if (user) {
                state.user = user;
                state.currentView = 'dashboard';
                showToast(`Selamat datang, ${user.nama_lengkap}!`, 'success');
                render();
            } else {
                showToast('Email atau kata sandi tidak cocok!', 'error');
            }
        };

        window.handleLogout = function() {
            state.user = null;
            state.currentView = 'login';
            showToast('Anda telah keluar dari akun.', 'info');
            render();
        };

        function render() {
            appRoot.innerHTML = '';
            const container = document.createElement('div');
            container.className = 'w-full h-full fade-in flex flex-col';

            if (state.currentView === 'login') {
                container.innerHTML = getLoginHTML();
            } else if (state.currentView === 'supabase_setup') {
                container.innerHTML = getSupabaseSetupHTML();
            } else {
                container.innerHTML += getNavbarHTML();

                if (state.user.role === 'Admin') {
                    if (state.currentView === 'dashboard') container.innerHTML += getAdminDashboardHTML();
                    else if (state.currentView === 'admin_users') container.innerHTML += getAdminManageUsersHTML();
                    else if (state.currentView === 'form_topik') container.innerHTML += getTeacherFormCourseHTML();
                    else if (state.currentView === 'course_guru') container.innerHTML += getTeacherCourseHTML();
                    else if (state.currentView === 'form_sesi') container.innerHTML += getTeacherFormSessionHTML();
                } else if (state.user.role === 'Guru') {
                    if (state.currentView === 'dashboard') container.innerHTML += getTeacherDashboardHTML();
                    else if (state.currentView === 'setting_sertifikat') container.innerHTML += getTeacherCertificateSettingHTML();
                    else if (state.currentView === 'form_topik') container.innerHTML += getTeacherFormCourseHTML();
                    else if (state.currentView === 'course_guru') container.innerHTML += getTeacherCourseHTML();
                    else if (state.currentView === 'form_sesi') container.innerHTML += getTeacherFormSessionHTML();
                } else if (state.user.role === 'Siswa') {
                    if (state.currentView === 'dashboard') container.innerHTML += getStudentDashboardHTML();
                    else if (state.currentView === 'course_siswa') container.innerHTML += getStudentCourseHTML();
                    else if (state.currentView === 'session_siswa') container.innerHTML += getStudentSessionHTML();
                }
            }

            appRoot.appendChild(container);
        }

        async function bootApp() {
            getLocalStorageData();
            await initSupabaseClient();
            render();
        }

        window.addEventListener('DOMContentLoaded', () => {
            bootApp();
        });
    </script>
</body>
</html>

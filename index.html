        /*
          UNIVERSAL METADATA ENGINE (Schema-Free Architecture):
          Fungsi ini menjamin penambahan topik tak terbatas tanpa perlu membuat kolom baru di database!
          Atribut dinamis (theme, token_akses) dienkapsulasi ke dalam deskripsi_singkat dengan aman.
          Jika Supabase memiliki kolom 'theme' & 'token_akses', sistem juga memanfaatkannya.
        */
        function packCoursePayload(course) {
            const meta = {
                theme: course.theme || 'indigo',
                token: course.token_akses || generateRandomToken('EDU')
            };
            const cleanDesc = (course.deskripsi_singkat || '').replace(/<!--RAE_META:[\s\S]*?-->/g, '').trim();
            const packedDesc = `${cleanDesc}\n<!--RAE_META:${JSON.stringify(meta)}-->`;
            
            return {
                basePayload: {
                    course_id: Number(course.course_id),
                    guru_id: Number(course.guru_id),
                    judul_kursus: course.judul_kursus,
                    deskripsi_singkat: packedDesc
                },
                extendedPayload: {
                    course_id: Number(course.course_id),
                    guru_id: Number(course.guru_id),
                    judul_kursus: course.judul_kursus,
                    deskripsi_singkat: packedDesc,
                    theme: meta.theme,
                    token_akses: meta.token
                }
            };
        }

        function unpackCourseData(rawCourse) {
            let theme = 'indigo';
            let token = generateRandomToken('EDU');
            let desc = rawCourse.deskripsi_singkat || '';

            // 1. Ekstrak dari metadata terenkapsulasi
            const metaMatch = desc.match(/<!--RAE_META:([\s\S]*?)-->/);
            if (metaMatch) {
                try {
                    const parsed = JSON.parse(metaMatch[1]);
                    if (parsed.theme) theme = parsed.theme;
                    if (parsed.token) token = parsed.token;
                    desc = desc.replace(/<!--RAE_META:[\s\S]*?-->/g, '').trim();
                } catch (e) {
                    console.warn('Gagal decode metadata course:', e);
                }
            }

            // 2. Jika kolom cloud eksplisit ada, gunakan prioritas tertinggi
            if (rawCourse.theme && rawCourse.theme.trim() !== '') theme = rawCourse.theme;
            if (rawCourse.token_akses && rawCourse.token_akses.trim() !== '') token = rawCourse.token_akses;

            // 3. Cadangan lokal (LocalStorage) jika pernah diatur
            const localSavedTheme = localStorage.getItem(`lms_theme_${rawCourse.course_id}`);
            if (localSavedTheme) theme = localSavedTheme;
            const localSavedToken = localStorage.getItem(`lms_token_${rawCourse.course_id}`);
            if (localSavedToken) token = localSavedToken;

            // Sinkronkan cache lokal
            localStorage.setItem(`lms_theme_${rawCourse.course_id}`, theme);
            localStorage.setItem(`lms_token_${rawCourse.course_id}`, token);

            return {
                ...rawCourse,
                deskripsi_singkat: desc,
                theme: theme,
                token_akses: token
            };
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const configs = {
                info: { bg: 'bg-blue-600', icon: 'ph-info' },
                success: { bg: 'bg-emerald-600', icon: 'ph-check-circle' },
                error: { bg: 'bg-rose-600', icon: 'ph-warning-circle' },
                warning: { bg: 'bg-amber-500', icon: 'ph-warning' }
            };
            const cfg = configs[type] || configs.info;
            toast.className = `${cfg.bg} text-white px-4 py-3 rounded-2xl shadow-xl transform transition-all duration-300 translate-y-6 opacity-0 flex items-center gap-3 text-sm font-semibold border border-white/10 z-50`;
            toast.innerHTML = `<i class="ph-bold ${cfg.icon} text-lg shrink-0"></i> <span>${message}</span>`;
            toastContainer.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-6', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function copyToClipboard(text, customMessage = 'Token berhasil disalin ke clipboard!') {
            const temp = document.createElement('textarea');
            temp.value = text;
            temp.setAttribute('readonly', '');
            temp.style.position = 'absolute';
            temp.style.left = '-9999px';
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            showToast(customMessage, 'success');
        }

        const DB = {
            getCourseSessions: (courseId) => sessionsTable.filter(s => Number(s.course_id) === Number(courseId)).sort((a, b) => Number(a.urutan_sesi) - Number(b.urutan_sesi)),
            getSessionQuiz: (sessionId) => quizzesTable.filter(q => Number(q.session_id) === Number(sessionId)),
            getUserProgressForCourse: (userId, courseId) => {
                const sessionIds = DB.getCourseSessions(courseId).map(s => Number(s.session_id));
                return userProgressTable.filter(p => Number(p.user_id) === Number(userId) && sessionIds.includes(Number(p.session_id)));
            },
            isSessionLocked: (userId, courseId, urutanSesi) => {
                if (Number(urutanSesi) === 1) return false;
                const prevSession = DB.getCourseSessions(courseId).find(s => Number(s.urutan_sesi) === Number(urutanSesi) - 1);
                if (!prevSession) return false;
                const prevProg = userProgressTable.find(p => Number(p.user_id) === Number(userId) && Number(p.session_id) === Number(prevSession.session_id));
                return !(prevProg && prevProg.status_sesi === 'Selesai');
            },
            getCourseProgressPercent: (userId, courseId) => {
                const allSessions = DB.getCourseSessions(courseId);
                if (allSessions.length === 0) return 0;
                const completedCount = DB.getUserProgressForCourse(userId, courseId).filter(p => p.status_sesi === 'Selesai').length;
                return Math.round((completedCount / allSessions.length) * 100);
            },
            isCourseUnlockedForStudent: (userId, courseId) => {
                const course = coursesTable.find(c => Number(c.course_id) === Number(courseId));
                if (!course) return false;
                if (!course.token_akses || course.token_akses.trim() === '') return true;

                try {

                    const unlockedList = JSON.parse(raw);

        async function initSupabaseClient() {
            supabaseUrl = (localStorage.getItem('SUPABASE_URL') || '').trim();
            supabaseKey = (localStorage.getItem('SUPABASE_ANON_KEY') || '').trim();
            if (supabaseUrl && supabaseKey) {
                try {
                    supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
                    isCloudConnected = true;
                    return true;
                } catch (e) {
                    supabaseClient = null;
                    isCloudConnected = false;
                    return false;
                }
            }
            isCloudConnected = false;
            return false;
        }

        async function uploadSingleCourseToCloud(course) {
            if (!supabaseClient) return;
            const payloads = packCoursePayload(course);

            try {
                // 1. Coba upload dengan payload lengkap
                const { error: fullErr } = await supabaseClient.from('courses').upsert([payloads.extendedPayload]);
                if (fullErr) {
                    // 2. Fallback instan ke Base Payload (100% aman dari error kolom!)
                    await supabaseClient.from('courses').upsert([payloads.basePayload]);
                }
            } catch (e) {
                // Fallback kedua
                try {
                    await supabaseClient.from('courses').upsert([payloads.basePayload]);
                } catch (err2) {
                    console.warn('Fallback upload course:', err2);
                }
            }
        }

        async function manualSyncSupabase(silent = false) {
            if (!silent) showToast('Menyinkronkan data dengan Supabase...', 'info');
            const isReady = await initSupabaseClient();
            if (!isReady || !supabaseClient) {
                if (!silent) {
                    showToast('Koneksi Supabase belum lengkap. Silakan atur konfigurasi.', 'warning');
                    state.currentView = 'supabase_setup';
                    render();
                }
                return;
            }

            try {
                // 1. Tarik Data Cloud
                const [resUsers, resCourses, resSessions, resQuizzes, resProg] = await Promise.all([
                    supabaseClient.from('users').select('*'),
                    supabaseClient.from('courses').select('*'),
                    supabaseClient.from('sessions').select('*'),
                    supabaseClient.from('quizzes').select('*'),
                    supabaseClient.from('user_progress').select('*')
                ]);

                // 2. TWO-WAY UPLOAD: Cek jika ada topik lokal yang belum ada di Cloud, unggah otomatis!
                let cloudCourses = (resCourses.data && resCourses.data.length > 0) ? resCourses.data : [];
                const cloudIds = new Set(cloudCourses.map(c => Number(c.course_id)));
                const unsyncedLocalCourses = coursesTable.filter(c => !cloudIds.has(Number(c.course_id)));

                if (unsyncedLocalCourses.length > 0) {
                    for (const localC of unsyncedLocalCourses) {
                        await uploadSingleCourseToCloud(localC);
                    }
                    const refreshCourses = await supabaseClient.from('courses').select('*');
                    if (refreshCourses.data) cloudCourses = refreshCourses.data;
                }

                // 3. Ekstrak courses melalui Universal Metadata Engine
                if (cloudCourses.length > 0) {
                    coursesTable = cloudCourses.map(unpackCourseData);
                } else {
                    for (const initC of initialCoursesMock) {
                        await uploadSingleCourseToCloud(initC);
                    }
                    coursesTable = initialCoursesMock.map(unpackCourseData);
                }

                // 4. Sinkronkan tabel lainnya
                if (resUsers.data && resUsers.data.length > 0) usersTable = resUsers.data;
                else { await supabaseClient.from('users').insert(initialUsersMock); usersTable = [...initialUsersMock]; }

                if (resSessions.data && resSessions.data.length > 0) sessionsTable = resSessions.data;
                else { await supabaseClient.from('sessions').insert(initialSessionsMock); sessionsTable = [...initialSessionsMock]; }

                if (resQuizzes.data && resQuizzes.data.length > 0) quizzesTable = resQuizzes.data;
                else { await supabaseClient.from('quizzes').insert(initialQuizzesMock); quizzesTable = [...initialQuizzesMock]; }

                if (resProg.data) userProgressTable = resProg.data;

                saveLocalStorageData();
                isCloudConnected = true;
                if (!silent) showToast('Sinkronisasi cloud berhasil & data selaras!', 'success');
                render();
            } catch (err) {
                console.error('Error Sync Supabase:', err);
                isCloudConnected = false;
                if (!silent) showToast('Gagal sinkron cloud: ' + (err.message || 'Periksa koneksi'), 'error');
            }
        }

        window.randomizeCreateCourseToken = function() {

        window.handleCreateCourse = async function(e) {
            e.preventDefault();
            const guruId = Number(document.getElementById('course-instruktur').value);
            const title = document.getElementById('course-title').value.trim();
            const desc = document.getElementById('course-desc').value.trim();
            const token = document.getElementById('course-token').value.trim().toUpperCase() || generateRandomToken('EDU');
            const selectedTheme = document.querySelector('input[name="course-theme-radio"]:checked')?.value || 'indigo';

            const maxId = coursesTable.reduce((m, c) => Math.max(m, Number(c.course_id) || 0), 100);
            const newCourseId = maxId + 1;
            const newCourse = {
                course_id: newCourseId,
                guru_id: guruId,
                judul_kursus: title,
                deskripsi_singkat: desc,
                theme: selectedTheme,
                token_akses: token
            };

            // Tambahkan langsung ke daftar lokal
            coursesTable.unshift(newCourse);
            
            // Simpan tema dan token ke kunci cadangan lokal
            localStorage.setItem(`lms_theme_${newCourseId}`, selectedTheme);
            localStorage.setItem(`lms_token_${newCourseId}`, token);
            saveLocalStorageData();

            // UPLOAD CERDAS DENGAN UNIVERSAL METADATA ENGINE
            if (supabaseClient) {
                showToast('Menyimpan topik baru ke cloud Supabase...', 'info');
                await uploadSingleCourseToCloud(newCourse);
            }

            showToast('Topik pembelajaran baru berhasil disimpan & disinkronkan!', 'success');
            navigateTo('dashboard');
        };

        window.executeDeleteTopic = async function(courseId) {
            coursesTable = coursesTable.filter(c => Number(c.course_id) !== Number(courseId));
            sessionsTable = sessionsTable.filter(s => Number(s.course_id) !== Number(courseId));
            saveLocalStorageData();

            if (supabaseClient) {
                try {
                    await supabaseClient.from('courses').delete().eq('course_id', courseId);
                    await supabaseClient.from('sessions').delete().eq('course_id', courseId);

        window.handleExecuteBulkImport = async function(e) {
            e.preventDefault();
            const text = document.getElementById('bulk-import-text').value.trim();
            const lines = text.split('\n').filter(l => l.trim().length > 0);
            let addedCount = 0;

            const newUsers = [];
            let maxId = usersTable.reduce((m, u) => Math.max(m, Number(u.user_id) || 0), 10);

            lines.forEach(line => {
                const parts = line.split(',').map(p => p.trim());
                if (parts.length >= 2) {
                    const name = parts[0];
                    const email = parts[1].toLowerCase();
                    const pass = parts[2] || '123';

                    if (!usersTable.some(u => u.email.toLowerCase() === email)) {
                        maxId++;
                        const uObj = { user_id: maxId, nama_lengkap: name, email: email, password: pass, role: 'Siswa', instansi: state.user.instansi || '', ttd_url: '' };
                        usersTable.push(uObj);
                        newUsers.push(uObj);
                        addedCount++;
                    }
                }
            });

            saveLocalStorageData();
            if (supabaseClient && newUsers.length > 0) {
                try {
                    await supabaseClient.from('users').upsert(newUsers);
                } catch (err) {
                    console.warn('Gagal sync bulk user:', err);
                }
            }

            closeModal();
            showToast(`${addedCount} akun siswa berhasil ditambahkan & disinkronkan!`, 'success');
            render();
        };

        window.handleSubmitQuiz = async function(sessionId) {
            const session = sessionsTable.find(s => Number(s.session_id) === Number(sessionId));
            if (!session) return;

            const questions = state.quizState.questions;
            let correctCount = 0;

            questions.forEach(q => {
                if (state.quizState.answers[q.quiz_id] === q.jawaban_benar) {
                    correctCount++;
                }
            });

            const score = questions.length > 0 ? Math.round((correctCount / questions.length) * 100) : 0;
            state.quizState.lastScore = score;

            if (score >= session.kkm_kuis) {
                let prog = userProgressTable.find(p => Number(p.user_id) === Number(state.user.user_id) && Number(p.session_id) === Number(sessionId));
                if (!prog) {
                    const newProgId = Date.now();
                    prog = { progress_id: newProgId, user_id: Number(state.user.user_id), session_id: Number(sessionId), skor_kuis: score, status_sesi: 'Selesai' };
                    userProgressTable.push(prog);
                } else {
                    prog.skor_kuis = Math.max(prog.skor_kuis || 0, score);
                    prog.status_sesi = 'Selesai';
                }

                saveLocalStorageData();
                if (supabaseClient) {
                    try {
                        await supabaseClient.from('user_progress').upsert([prog]);
                    } catch (e) {
                        console.warn('Sync progress:', e);
                    }
                }

                if (typeof confetti === 'function') confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 } });
                showToast(`Selamat! Anda LULUS dengan nilai ${score}!`, 'success');
            } else {
                state.quizState.showResultScreen = true;
                showToast(`Nilai ${score} belum mencapai KKM (${session.kkm_kuis}). Silakan coba lagi.`, 'warning');
            }

            render();
        };

                        <button onclick="navigateTo('course_guru', {courseId: ${state.activeCourseId}})" class="text-indigo-600 hover:underline flex items-center gap-1.5 font-bold text-sm">
                            <i class="ph-bold ph-arrow-left"></i> Batal & Kembali
                        </button>

                        <div class="bg-white rounded-3xl p-6 sm:p-7 border border-slate-200 shadow-xs">
                            <h2 class="text-xl font-black text-slate-900 mb-1">Tambah Sesi Pembelajaran ke-${nextUrutan}</h2>
                            <p class="text-xs text-slate-500 mb-5">Untuk Topik: ${course ? course.judul_kursus : ''}</p>

                            <form onsubmit="handleCreateSession(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Uraian / Deskripsi Modul</label>
                                    <input id="sess-desc" type="text" required placeholder="Contoh: Pengenalan Komponen Daya 3 Fasa" class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Tujuan Pembelajaran</label>
                                    <textarea id="sess-tujuan" rows="2" required placeholder="1. Mampu mengidentifikasi komponen..." class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none resize-none"></textarea>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Tautan URL Video Materi</label>
                                    <input id="sess-video" type="url" required value="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=1000&auto=format&fit=crop&q=80" class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Bahan Diskusi Siswa</label>
                                    <input id="sess-diskusi" type="text" required placeholder="Apa yang terjadi jika pengaman beban tidak dikalibrasi?" class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Syarat Kelulusan KKM Kuis (0 - 100)</label>
                                    <input id="sess-kkm" type="number" min="50" max="100" value="70" required class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                                </div>
                                <div class="pt-3 flex justify-end">
                                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-7 rounded-xl text-xs transition shadow-md">
                                        Simpan Sesi Pembelajaran
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        window.handleCreateSession = async function(e) {
            e.preventDefault();
            const desc = document.getElementById('sess-desc').value.trim();
            const tujuan = document.getElementById('sess-tujuan').value.trim();
            const video = document.getElementById('sess-video').value.trim();
            const diskusi = document.getElementById('sess-diskusi').value.trim();
            const kkm = Number(document.getElementById('sess-kkm').value);

            const courseId = Number(state.activeCourseId);
            const nextUrutan = DB.getCourseSessions(courseId).length + 1;
            const newSessionId = Date.now();

            const newSession = {
                session_id: newSessionId,
                course_id: courseId,
                urutan_sesi: nextUrutan,
                deskripsi_modul: desc,
                tujuan_belajar: tujuan,
                link_video: video,
                bahan_diskusi: diskusi,
                kkm_kuis: kkm
            };

            sessionsTable.push(newSession);

            // Buat 10 Soal Kuis Default agar bisa dievaluasi
            for (let i = 1; i <= 10; i++) {
                quizzesTable.push({
                    quiz_id: Date.now() + i,
                    session_id: newSessionId,
                    pertanyaan: `Pertanyaan evaluasi ke-${i} untuk materi: ${desc}?`,
                    pilihan_ganda: ['Opsi Jawaban A', 'Opsi Jawaban B (Benar)', 'Opsi Jawaban C', 'Opsi Jawaban D'],
                    jawaban_benar: 1
                });
            }

            saveLocalStorageData();
            if (supabaseClient) {
                try {
                    await supabaseClient.from('sessions').insert([newSession]);
                } catch (err) {
                    console.warn('Sync new session:', err);
                }
            }

            showToast('Sesi pembelajaran baru berhasil dibuat!', 'success');
            navigateTo('course_guru', { courseId: courseId });
        };

        function getTeacherCertificateSettingHTML() {
            return `
                <div class="flex-1 bg-slate-50 overflow-y-auto custom-scrollbar p-5 sm:p-8">
                    <div class="max-w-2xl mx-auto space-y-5">
                        <button onclick="navigateTo('dashboard')" class="text-indigo-600 hover:underline flex items-center gap-1.5 font-bold text-sm">
                            <i class="ph-bold ph-arrow-left"></i> Kembali ke Dasbor
                        </button>

                        <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-xs">
                            <h2 class="text-xl font-black text-slate-900 mb-1">Pengaturan Sertifikat & Tanda Tangan</h2>
                            <p class="text-xs text-slate-500 mb-6">Informasi ini akan tertera pada sertifikat PDF yang diterbitkan untuk siswa.</p>

                            <form onsubmit="handleSaveCertificateSetting(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nama Instansi / Sekolah</label>
                                    <input id="cert-instansi" type="text" required value="${state.user.instansi || ''}" placeholder="Contoh: SMK Negeri 1 Kota Tangerang Selatan" class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Unggah Tanda Tangan Digital (PNG/JPG Transparan)</label>
                                    <input id="cert-ttd-file" type="file" accept="image/*" onchange="previewTtdImage(event)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                                </div>
                                <div id="ttd-preview-box" class="p-3 bg-slate-50 border border-slate-200 rounded-2xl flex items-center justify-center min-h-[90px]">
                                    ${state.user.ttd_url ? `<img src="${state.user.ttd_url}" class="max-h-20 object-contain">` : '<span class="text-xs text-slate-400">Pratinjau tanda tangan akan muncul di sini</span>'}
                                </div>
                                <div class="pt-2 flex justify-end">
                                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-6 rounded-xl text-xs transition shadow-md">
                                        Simpan Pengaturan Sertifikat
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        window.previewTtdImage = function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    state.user.ttd_url = evt.target.result;
                    const box = document.getElementById('ttd-preview-box');
                    if (box) box.innerHTML = `<img src="${evt.target.result}" class="max-h-20 object-contain">`;
                };
                reader.readAsDataURL(file);
            }
        };

        window.handleSaveCertificateSetting = async function(e) {
            e.preventDefault();
            const instansi = document.getElementById('cert-instansi').value.trim();
            state.user.instansi = instansi;

            const uIdx = usersTable.findIndex(u => Number(u.user_id) === Number(state.user.user_id));
            if (uIdx !== -1) {
                usersTable[uIdx].instansi = instansi;
                usersTable[uIdx].ttd_url = state.user.ttd_url;
            }

            saveLocalStorageData();
            if (supabaseClient) {
                try {
                    await supabaseClient.from('users').update({ instansi: instansi, ttd_url: state.user.ttd_url }).eq('user_id', state.user.user_id);
                } catch (err) {
                    console.warn('Update cert setting Supabase:', err);
                }
            }

            showToast('Pengaturan sertifikat berhasil disimpan!', 'success');
            navigateTo('dashboard');
        };

        function getAdminManageUsersHTML() {
            return `
                <div class="flex-1 bg-slate-50 overflow-y-auto custom-scrollbar p-5 sm:p-8">
                    <div class="max-w-5xl mx-auto space-y-6">
                        <div class="flex justify-between items-center">
                            <button onclick="navigateTo('dashboard')" class="text-indigo-600 hover:underline flex items-center gap-1.5 font-bold text-sm">
                                <i class="ph-bold ph-arrow-left"></i> Kembali ke Dasbor
                            </button>
                            <button onclick="openBulkImportModal()" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-4 rounded-xl text-xs transition flex items-center gap-1.5">
                                <i class="ph-bold ph-file-arrow-up"></i> Upload Siswa Massal
                            </button>
                        </div>

                        <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-xs">
                            <h2 class="text-lg font-bold text-slate-800 mb-4">Daftar Seluruh Pengguna (${usersTable.length} Akun)</h2>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-xs">
                                    <thead class="bg-slate-50 uppercase text-slate-500 font-bold border-y border-slate-200">
                                        <tr>
                                            <th class="py-3 px-4">Nama Lengkap</th>
                                            <th class="py-3 px-4">Email</th>
                                            <th class="py-3 px-4">Peran (Role)</th>
                                            <th class="py-3 px-4">Instansi</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100">
                                        ${usersTable.map(u => `
                                            <tr class="hover:bg-slate-50/70">
                                                <td class="py-3 px-4 font-bold text-slate-800">${u.nama_lengkap}</td>
                                                <td class="py-3 px-4 text-slate-600">${u.email}</td>
                                                <td class="py-3 px-4"><span class="px-2 py-0.5 rounded-full font-bold ${u.role === 'Admin' ? 'bg-emerald-50 text-emerald-700' : (u.role === 'Guru' ? 'bg-indigo-50 text-indigo-700' : 'bg-blue-50 text-blue-700')}">${u.role}</span></td>
                                                <td class="py-3 px-4 text-slate-500">${u.instansi || '-'}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getStudentSessionHTML() {
            const session = sessionsTable.find(s => Number(s.session_id) === Number(state.activeSessionId));
            if (!session) return '<div class="p-8">Sesi tidak ditemukan.</div>';

            const course = coursesTable.find(c => Number(c.course_id) === Number(session.course_id));
            const progress = userProgressTable.find(p => Number(p.user_id) === Number(state.user.user_id) && Number(p.session_id) === Number(session.session_id));
            const isCompleted = progress && progress.status_sesi === 'Selesai';
            const quizzes = state.quizState.questions;

            return `
                <div class="flex-1 bg-slate-50 overflow-y-auto custom-scrollbar p-5 sm:p-8">
                    <div class="max-w-3xl mx-auto space-y-6">
                        <button onclick="navigateTo('course_siswa')" class="text-blue-600 hover:underline flex items-center gap-1.5 font-bold text-sm">
                            <i class="ph-bold ph-arrow-left"></i> Kembali ke Silabus
                        </button>

                        <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-xs space-y-5">
                            <div>
                                <span class="text-xs font-bold text-blue-600 uppercase tracking-wider">Sesi ke-${session.urutan_sesi}</span>
                                <h1 class="text-2xl font-black text-slate-800 mt-1">${course.judul_kursus}</h1>
                                <p class="text-sm text-slate-600 mt-2 leading-relaxed">${session.deskripsi_modul}</p>
                            </div>

                            <div class="bg-blue-50/70 border border-blue-100 rounded-2xl p-4">
                                <h4 class="text-xs font-bold text-blue-900 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                                    <i class="ph-bold ph-target"></i> Tujuan Pembelajaran
                                </h4>
                                <ul class="text-xs text-blue-800 space-y-1">
                                    ${session.tujuan_belajar.split('\n').filter(t => t.trim()).map(t => `<li class="flex items-start gap-1.5"><i class="ph-bold ph-check mt-0.5 text-blue-600"></i> ${t}</li>`).join('')}
                                </ul>
                            </div>

                            <div>
                                <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                                    <i class="ph-bold ph-video"></i> Video Modul Pembelajaran
                                </h4>
                                <div class="rounded-2xl overflow-hidden border border-slate-200 aspect-video relative bg-slate-900 group">
                                    <img src="${session.link_video}" alt="Video" class="w-full h-full object-cover opacity-80 group-hover:scale-105 transition-transform duration-300">
                                    <div class="absolute inset-0 flex items-center justify-center">
                                        <button onclick="showToast('Video materi sedang diputar...', 'info')" class="w-16 h-16 rounded-full bg-white/90 text-blue-600 hover:bg-white shadow-xl flex items-center justify-center text-3xl transition">
                                            <i class="ph-fill ph-play ml-1"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-amber-50/70 border border-amber-200 rounded-2xl p-4">
                                <h4 class="text-xs font-bold text-amber-900 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                                    <i class="ph-bold ph-chats-circle"></i> Pemantik Diskusi
                                </h4>
                                <p class="text-xs text-amber-800">${session.bahan_diskusi}</p>
                            </div>
                        </div>

                        <!-- Evaluasi Kuis 10 Soal -->
                        <div class="bg-white rounded-3xl border border-slate-200 shadow-xs overflow-hidden">
                            <div class="p-5 ${isCompleted ? 'bg-emerald-600' : 'bg-slate-900'} text-white flex justify-between items-center">
                                <div>
                                    <h3 class="font-extrabold text-lg flex items-center gap-2">
                                        <i class="ph-bold ph-exam"></i> Evaluasi Kompetensi (10 Kuis)
                                    </h3>
                                    <span class="text-xs ${isCompleted ? 'text-emerald-100' : 'text-slate-400'}">Syarat Kelulusan KKM: ${session.kkm_kuis}</span>
                                </div>
                                ${isCompleted ? `
                                    <span class="bg-white/20 text-white font-extrabold text-xs px-3.5 py-1.5 rounded-full border border-white/20">
                                        LULUS • Nilai: ${progress.skor_kuis}
                                    </span>
                                ` : ''}
                            </div>

                            <div class="p-6">
                                ${isCompleted ? `
                                    <div class="text-center py-6 space-y-3">
                                        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto">
                                            <i class="ph-bold ph-check"></i>
                                        </div>
                                        <h4 class="text-xl font-bold text-slate-800">Sesi Ini Telah Tuntas!</h4>
                                        <p class="text-xs text-slate-500 max-w-md mx-auto">Anda telah lulus kuis evaluasi dengan skor ${progress.skor_kuis}. Anda dapat melangkah ke sesi selanjutnya.</p>
                                        <button onclick="navigateTo('course_siswa')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded-xl text-xs transition shadow-xs">
                                            Lanjut ke Silabus
                                        </button>
                                    </div>
                                ` : (state.quizState.showResultScreen ? `
                                    <div class="text-center py-6 space-y-4">
                                        <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center text-3xl mx-auto">
                                            <i class="ph-bold ph-x"></i>
                                        </div>
                                        <div>
                                            <h4 class="text-xl font-bold text-slate-800">Belum Mencapai KKM</h4>
                                            <p class="text-xs text-slate-500 mt-1">Skor Anda: <span class="font-extrabold text-rose-600 text-base">${state.quizState.lastScore}</span> (KKM: ${session.kkm_kuis})</p>
                                        </div>
                                        <p class="text-xs text-slate-400 max-w-sm mx-auto">Coba ulangi kembali kuis dengan urutan pertanyaan yang telah diacak.</p>
                                        <button onclick="handleRetryQuiz(${session.session_id})" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl text-xs transition shadow-md flex items-center gap-2 mx-auto">
                                            <i class="ph-bold ph-arrows-clockwise text-base"></i> Ulangi Kuis (Acak Soal)
                                        </button>
                                    </div>
                                ` : `
                                    ${quizzes.length === 0 ? '<p class="text-center text-slate-400 py-6">Kuis belum dikonfigurasi untuk sesi ini.</p>' : `
                                        <div>
                                            ${(() => {
                                                const qIdx = state.quizState.currentIndex;
                                                const q = quizzes[qIdx];
                                                const currentAnswer = state.quizState.answers[q.quiz_id];

                                                return `
                                                    <div class="space-y-4">
                                                        <div class="flex justify-between items-center text-xs font-bold text-slate-500 pb-2 border-b border-slate-100">
                                                            <span>Pertanyaan ${qIdx + 1} dari ${quizzes.length}</span>
                                                            <span class="text-indigo-600">${Math.round(((qIdx + 1) / quizzes.length) * 100)}%</span>
                                                        </div>

                                                        <h4 class="text-base font-bold text-slate-800 leading-snug">${q.pertanyaan}</h4>

                                                        <div class="space-y-2 pt-2">
                                                            ${q.pilihan_ganda.map((opt, oIdx) => {
                                                                const isSelected = currentAnswer === oIdx;
                                                                return `
                                                                    <div onclick="handleChooseAnswer(${q.quiz_id}, ${oIdx})" class="p-3.5 rounded-xl border text-xs font-medium cursor-pointer transition flex items-center justify-between ${
                                                                        isSelected ? 'bg-indigo-50 border-indigo-600 text-indigo-900 font-bold' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
                                                                    }">
                                                                        <span>${['A', 'B', 'C', 'D'][oIdx]}. ${opt}</span>
                                                                        <i class="ph-bold ${isSelected ? 'ph-check-circle text-indigo-600 text-base' : 'ph-circle text-slate-300 text-base'}"></i>
                                                                    </div>
                                                                `;
                                                            }).join('')}
                                                        </div>

                                                        <div class="pt-4 flex justify-between items-center border-t border-slate-100 mt-4">
                                                            <button onclick="handleQuizNav(-1)" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition flex items-center gap-1 ${qIdx === 0 ? 'invisible' : ''}">
                                                                <i class="ph-bold ph-arrow-left"></i> Sebelumnya
                                                            </button>

                                                            ${qIdx === quizzes.length - 1 ? `
                                                                <button onclick="handleSubmitQuiz(${session.session_id})" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-extrabold transition shadow-md flex items-center gap-1.5">
                                                                    <span>Selesaikan & Kumpulkan</span> <i class="ph-bold ph-check"></i>
                                                                </button>
                                                            ` : `
                                                                <button onclick="handleQuizNav(1)" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1">
                                                                    <span>Selanjutnya</span> <i class="ph-bold ph-arrow-right"></i>
                                                                </button>
                                                            `}
                                                        </div>
                                                    </div>
                                                `;
                                            })()}
                                        </div>
                                    `}
                                `)}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function navigateTo(view, data = {}) {
            if (data.courseId) state.activeCourseId = data.courseId;
            if (data.sessionId) {
                state.activeSessionId = data.sessionId;
                initQuizState(data.sessionId, false);
            }
            state.currentView = view;
            render();
        }

        function initQuizState(sessionId, shuffle = false) {
            let questions = DB.getSessionQuiz(sessionId);
            if (shuffle) {
                questions = [...questions].sort(() => Math.random() - 0.5);
            }
            state.quizState.questions = questions;
            state.quizState.currentIndex = 0;
            state.quizState.answers = {};
            state.quizState.showResultScreen = false;
            state.quizState.lastScore = 0;
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const pass = document.getElementById('login-password').value.trim();

            const user = usersTable.find(u => u.email.toLowerCase() === email && u.password === pass);

            if (user) {
                state.user = user;
                state.currentView = 'dashboard';
                showToast(`Selamat datang, ${user.nama_lengkap}!`, 'success');
                render();
                manualSyncSupabase(true);
            } else {
                showToast('Email atau kata sandi tidak cocok!', 'error');
            }
        }

        function handleLogout() {
            state.user = null;
            state.currentView = 'login';
            showToast('Anda telah keluar dari akun.', 'info');
            render();
        }

        function render() {
            appRoot.innerHTML = '';
            const container = document.createElement('div');
            container.className = 'w-full h-full fade-in flex flex-col overflow-hidden';

            if (state.currentView === 'login') {
                container.innerHTML = getLoginHTML();
            } else if (state.currentView === 'supabase_setup') {
                container.innerHTML = getSupabaseSetupHTML();
            } else {
                container.innerHTML += getNavbarHTML();

                if (state.user.role === 'Admin') {
                    if (state.currentView === 'dashboard') container.innerHTML += getAdminDashboardHTML();
                    else if (state.currentView === 'admin_users') container.innerHTML += getAdminManageUsersHTML();
                    else if (state.currentView === 'form_topik') container.innerHTML += getTeacherFormCourseHTML();
                    else if (state.currentView === 'course_guru') container.innerHTML += getTeacherCourseHTML();
                    else if (state.currentView === 'form_sesi') container.innerHTML += getTeacherFormSessionHTML();
                } else if (state.user.role === 'Guru') {
                    if (state.currentView === 'dashboard') container.innerHTML += getTeacherDashboardHTML();
                    else if (state.currentView === 'setting_sertifikat') container.innerHTML += getTeacherCertificateSettingHTML();
                    else if (state.currentView === 'form_topik') container.innerHTML += getTeacherFormCourseHTML();
                    else if (state.currentView === 'course_guru') container.innerHTML += getTeacherCourseHTML();
                    else if (state.currentView === 'form_sesi') container.innerHTML += getTeacherFormSessionHTML();
                } else if (state.user.role === 'Siswa') {
                    if (state.currentView === 'dashboard') container.innerHTML += getStudentDashboardHTML();
                    else if (state.currentView === 'course_siswa') container.innerHTML += getStudentCourseHTML();
                    else if (state.currentView === 'session_siswa') container.innerHTML += getStudentSessionHTML();
                }
            }

            appRoot.appendChild(container);
        }

        async function bootApp() {
            getLocalStorageData();
            await initSupabaseClient();
            render();
        }

        window.addEventListener('DOMContentLoaded', () => {
            bootApp();
        });
    </script>
</body>
</html>
